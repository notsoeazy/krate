name: krate
description: "Your personal local media vault for movies and series."
publish_to: "none"
version: 0.4.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  sqflite: ^2.4.2

  # Networking & API
  http: ^1.6.0
  dio: ^5.9.2
  flutter_dotenv: ^6.0.0

  # Storage & Preferences
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.4

  # File Handling
  file_picker: ^10.3.10
  permission_handler: ^11.3.1

  # Image
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Video Playback
  awesome_video_player: ^1.0.5

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
